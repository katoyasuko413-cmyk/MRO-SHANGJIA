  <rect width="100%" height="100%" fill="#ffffff" />
  
  <g fill="#e60012">
    <!-- Letter B (Smooth Geometric Curves, fill-rule="evenodd" for inner hollow cutouts) -->
    <path d="M 72.5 120 h 45 c 15 0, 25 8, 25 22 c 0, 10, -5, 16, -12, 18 c 9, 2, 15, 9, 15, 20 c 0, 15, -12, 24, -28, 24 h -45 Z M 90.5 134 v 16 h 22 c 7 0, 11 -2, 11 -8 c 0, -6, -4, -8, -11, -8 Z M 90.5 168 v 16 h 25 c 8 0, 12 -3, 12 -9 c 0, -6, -4, -9, -12, -9 Z" fill-rule="evenodd" />
    
    <!-- Letter A (Futuristic No-Crossbar Chevron, 18px thickness) -->
    <path d="M 152.5 204 L 182.5 120 L 212.5 204 H 194.5 L 182.5 152 L 170.5 204 Z" />
    
    <!-- Letter I (Clean Vertical Stem, 18px thickness) -->
    <path d="M 227.5 120 H 245.5 V 204 H 227.5 Z" />
    
    <!-- Letter C (Symmetrical Semicircular Curve, 18px thickness) -->
    <path d="M 327.5 120 H 287.5 C 267.5 120, 257.5 135, 257.5 162 V 162 C 257.5 189, 267.5 204, 287.5 204 H 327.5 V 186 H 287.5 C 277.5 186, 275.5 180, 275.5 162 C 275.5 144, 277.5 138, 287.5 138 H 327.5 Z" />
  </g>
  
  <!-- "北汽集团" (Beijing Automotive Group Bold Typography) -->
  <text x="200" y="278" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="44" font-weight="950" fill="#e60012" letter-spacing="4">北汽集团</text>
</svg>
